pipeline:
  plate_segmenter: contour
  food_segmenter: color_components
  # "depth_anything" = calibrated monocular depth (recommended, needs torch +
  # transformers + a GPU/internet to fetch weights the first time).
  # "luminance_relative" = zero-dependency placeholder fallback.
  depth_estimator: depth_anything
  calibrator: known_geometry
  volume_estimator: area_height
  weight_estimator: density
  # Set to a dish classifier key to attach real dish names (e.g. "dal",
  # "aloo gobi") on top of the solid/liquid physical_type. Set to null to keep
  # foods labelled only "solid"/"liquid".
  food_classifier: yolo_convnext

plate:
  min_area_fraction: 0.10

food:
  min_area_px: 500
  saturation_threshold: 55
  boundary_margin_px: 12
  reference_difference_threshold: 18
  solid_min_coverage: 0.025
  tray_profile_path: configs/tray/ashoka.yaml
  # Robust perspective registration instead of a single minAreaRect homography
  # (see segmentation/sam_tray.py). Falls back to the minAreaRect homography
  # automatically if SAM2 weights aren't available.
  use_sam_registration: true

calibration:
  # Measured exterior of the Ashoka tray; see configs/tray/ashoka.yaml.
  reference_width_mm: 380.0
  reference_height_mm: 280.0
  reference_shape: rectangle

# NOTE: there is no max_height_cm / compartment depth number here on purpose.
# The physical ceiling (2.5 cm floor-to-rim) lives in exactly one place —
# `layout.compartment_depth_mm` in configs/tray/ashoka.yaml — and factory.py
# reads it from there to clamp both the volume estimator and the depth model.
# Duplicate that number in a second config file and the two WILL drift apart
# again (this is exactly the bug that was here before: max_height_cm=3.0cm
# and depth_range_cm=2.0cm, neither of which matched the real 2.5cm tray).
volume:
  min_height_cm: 0.45
  area_height_slope: 0.06
  liquid_fill_height_cm: 1.75

weight:
  default_density_g_ml: 0.85
  solid_density_g_ml: 0.85
  liquid_density_g_ml: 1.0
  densities_g_ml:
    liquid: 1.0
    # Optional per-dish overrides once you have real dish names, e.g.:
    # dal: 1.02
    # biryani: 0.75
    # aloo gobi: 0.90

depth:
  # Depth Anything V2 checkpoint (via transformers). "small" is fastest and
  # is normally enough since we only need relative ordering within a
  # compartment — the metric scale comes from self-calibration, not the
  # network's absolute output.
  model_id: depth-anything/Depth-Anything-V2-Small-hf
  device: auto  # "auto" | "cuda" | "cpu"
  # No fine-tuning: every image is self-calibrated against its own known-flat
  # exposed floor pixels (height = 0) and clamped by the compartment ceiling
  # (see calibration.compartment_depth_cm below, sourced from the tray file).
  # See src/portion_estimation/depth/metric_mono.py for the full method.
  min_floor_reference_px: 200  # fall back to the luminance placeholder below this

classification:
  yolo_weights: ../models/yolo_best.pt
  convnext_weights: ../models/convnext_base_ep018_macro_f1=0.9425.pt
  labels_path: ../models/labels.txt
  conf_threshold: 0.10
  iou_threshold: 0.30
  device: auto

output:
  write_json: true
  write_csv: true
  write_overlay: true
  min_label_weight_g: 3.0
